name: Build Android APK

# 触发方式：
# - workflow_dispatch：在 GitHub 网页 Actions 页手动点 Run workflow（推荐）
# - push：推到 main/master 分支时自动构建
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装 JDK 17（Android Gradle 构建必需）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 npm 依赖
        run: npm ci

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./android/gradlew

      - name: 构建 Release APK（自带 JS bundle，可直接安装，无需 Metro）
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ereader-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
